name: cryptoedu
description: "Gamified Crypto Trading Education Simulator - Educational virtual crypto trading platform focusing on trading discipline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0+1
  supabase_flutter: ^2.5.5
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  decimal: ^3.0.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  purchases_flutter: ^8.1.0
  connectivity_plus: ^6.0.3
  riverpod_annotation: ^2.3.5
  design_system:
    path: packages/design_system
  uuid: ^4.6.0
  permission_handler: ^13.0.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  go_router_builder: ^2.6.2

flutter:
  uses-material-design: true
